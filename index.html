<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PINEWOOD: THE WOODS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================================
         START SCREEN
         ========================================= -->

    <div id="startScreen">

        <div class="titleBox">

            <div class="smallTitle">
                PINEWOOD COUNTY
            </div>

            <h1>
                THE WOODS
            </h1>

            <p>
                October 1997
            </p>

            <p class="warning">
                Something is living out there.
            </p>

            <button id="startButton">
                START
            </button>

        </div>

    </div>


    <!-- =========================================
         MAIN GAME
         ========================================= -->

    <main id="game">

        <canvas
            id="gameCanvas"
            width="960"
            height="540"
        ></canvas>


        <!-- =====================================
             HUD
             ===================================== -->

        <div id="hud">

            <div class="playerHud">

                <div class="hudLabel">
                    HEALTH
                </div>

                <div class="bar">
                    <div
                        id="healthBar"
                        class="healthFill"
                    ></div>
                </div>

                <div
                    id="healthText"
                    class="hudNumber"
                >
                    100 / 100
                </div>


                <div class="hudLabel">
                    STAMINA
                </div>

                <div class="bar">
                    <div
                        id="staminaBar"
                        class="staminaFill"
                    ></div>
                </div>

                <div
                    id="staminaText"
                    class="hudNumber"
                >
                    100 / 100
                </div>

            </div>


            <div
                id="locationText"
                class="locationText"
            >
                PINEWOOD WOODS
            </div>

        </div>


        <!-- =====================================
             INTERACTION MESSAGE
             ===================================== -->

        <div
            id="interactionMessage"
            class="interactionMessage"
        >
        </div>


        <!-- =====================================
             FADE
             ===================================== -->

        <div
            id="screenFade"
            class="screenFade"
        ></div>


        <!-- =====================================
             CUTSCENE CONTAINER
             ===================================== -->

        <div
            id="cutscene"
            class="cutscene"
        >

            <div
                id="cutsceneText"
                class="cutsceneText"
            >
            </div>

            <button
                id="cutsceneButton"
            >
                CONTINUE
            </button>

        </div>


        <!-- =====================================
             BATTLE SCREEN

             File 2 will activate this.
             ===================================== -->

        <div
            id="battleScreen"
            class="battleScreen"
        >

            <div class="battleTop">

                <div
                    id="enemyName"
                    class="enemyName"
                >
                    UNKNOWN
                </div>

                <div class="enemyHealthBar">

                    <div
                        id="enemyHealthFill"
                        class="enemyHealthFill"
                    ></div>

                </div>

            </div>


            <div
                id="enemyArtwork"
                class="enemyArtwork"
            >
            </div>


            <div class="battleBottom">

                <div class="playerBattleStats">

                    <div>
                        HEALTH
                    </div>

                    <div
                        id="battleHealth"
                    >
                        100
                    </div>

                    <div>
                        STAMINA
                    </div>

                    <div
                        id="battleStamina"
                    >
                        100
                    </div>

                </div>


                <div
                    id="battleMessage"
                    class="battleMessage"
                >
                    What will you do?
                </div>


                <div class="battleButtons">

                    <button
                        id="quickAttack"
                    >
                        QUICK ATTACK
                    </button>

                    <button
                        id="heavyAttack"
                    >
                        HEAVY ATTACK
                    </button>

                    <button
                        id="specialAttack"
                    >
                        SPECIAL
                    </button>

                    <button
                        id="restButton"
                    >
                        REST
                    </button>

                    <button
                        id="runButton"
                    >
                        RUN
                    </button>

                </div>

            </div>

        </div>


        <!-- =====================================
             DEATH SCREEN
             ===================================== -->

        <div
            id="deathScreen"
            class="deathScreen"
        >

            <h1>
                YOU DIED
            </h1>

            <p>
                The woods went quiet.
            </p>

            <button
                id="restartButton"
            >
                TRY AGAIN
            </button>

        </div>


        <!-- =====================================
             NEWSPAPER / CLUE VIEWER
             ===================================== -->

        <div
            id="clueScreen"
            class="clueScreen"
        >

            <div
                id="clueContent"
                class="clueContent"
            >
            </div>

            <button
                id="closeClue"
            >
                CLOSE
            </button>

        </div>

    </main>


    <!-- =========================================
         GAME SCRIPT

         The next files will connect here.
         ========================================= -->

    <script src="game.js"></script>

</body>
</html>
